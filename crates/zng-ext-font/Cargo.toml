[package]
name = "zng-ext-font"
version = "0.17.7"
authors = ["The Zng Project Developers"]
edition = "2024"
license = "Apache-2.0 OR MIT"
readme = "README.md"
description = "Part of the zng project."
documentation = "https://zng-ui.github.io/doc/zng_ext_font"
repository = "https://github.com/zng-ui/zng"
categories = ["gui"]
keywords = ["gui", "ui", "user-interface", "zng"]

[features]
# Enable support for SVG image glyphs.
#
# This feature signals that the `IMAGES` service supports SVG. The app must ensure that this is so by
# using `zng-ext-svg` or another SVG extension.
svg = []

# Embed hyphenation data for all supported languages.
# 
# If enabled some 1.1 MiB of data is embedded. Instead of enabling this feature you can select 
# specific languages to support by adding a `hypher` dependency:
# 
# ```toml
# [dependencies]
# # only embed English hyphenation data.
# hypher = { version = "0.1", default-features = false, features = ["english"] }
# ```
hypher_full = ["hypher/full"]

# Enables memory mapped font files.
ipc = ["zng-task/ipc", "zng-view-api/ipc"]

[dependencies]
zng-clone-move = { path = "../zng-clone-move", version = "0.4.0", default-features = false }
zng-app-context = { path = "../zng-app-context", version = "0.15.2", default-features = false }
zng-app = { path = "../zng-app", version = "0.26.5", default-features = false }
zng-txt = { path = "../zng-txt", version = "0.6.0", default-features = false }
zng-view-api = { path = "../zng-view-api", version = "0.23.5", default-features = false }
zng-ext-l10n = { path = "../zng-ext-l10n", version = "0.18.6", default-features = false }
zng-var = { path = "../zng-var", version = "0.16.3", default-features = false }
zng-task = { path = "../zng-task", version = "0.16.5", default-features = false }
zng-layout = { path = "../zng-layout", version = "0.14.3", default-features = false }
zng-color = { path = "../zng-color", version = "0.16.5", default-features = false }
zng-ext-image = { path = "../zng-ext-image", version = "0.15.5", default-features = false }

serde = { version = "1.0", default-features = false }
unicase = { version = "2.7", default-features = false }
harfrust = { version = "0.16", default-features = false, features = ["std"] }
read-fonts = { version = "0.47", default-features = false, features = ["std"] }
skrifa = { version = "0.50", default-features = false, features = ["std"] }
byteorder = { version = "1.5", default-features = false, features = ["std"] }
icu_properties = { version = "2.0", default-features = false, features = ["compiled_data"] }
bitflags = { version = "2.5", default-features = false, features = ["serde", "bytemuck"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
pastey = { version = "0.2", default-features = false }
num_enum = { version = "0.7", default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data", "std"]}
unicode-linebreak = { version = "0.1", default-features = false }
unicode-segmentation = { version = "1.11", default-features = false }
unic-langid = { version = "0.9", default-features = false }
smallvec = { version = "1.13", default-features = false, features = ["const_new", "serde"] }
hashbrown = { version = "0.17", default-features = false, features = ["allocator-api2", "default-hasher", "equivalent", "inline-more", "raw-entry" ]}
pathfinder_geometry = { version = "0.5", default-features = false }
dunce = { version = "1.0", default-features = false }

# "hypher_full" feature docs mentions this version, on upgrade manually update it here and in zng/Cargo.toml and in HYPHENATION service docs
hypher = { version = "0.1", default-features = false, features = ["alloc"] }

fontique = { version = "0.13", default-features = false, features = ["std"] }
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
fontique = { version = "0.13", features = ["system"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
default-features = false
features = [
    "Win32_System_SystemInformation"
]

[build-dependencies]
cfg_aliases = { version = "0.2", default-features = false }

[package.metadata.docs.rs]
all-features = true
