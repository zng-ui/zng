[package]
name = "zng-ext-setup"
version = "0.1.2"
authors = ["The Zng Project Developers"]
edition = "2024"
license = "Apache-2.0 OR MIT"
readme = "README.md"
description = "Part of the zng project."
documentation = "https://zng-ui.github.io/doc/zng_state_map"
repository = "https://github.com/zng-ui/zng"
categories = ["gui"]
keywords = ["gui", "ui", "user-interface", "zng"]

[features]
# Enable save/load install config.
# 
# Config is saved as ZStd JSON.
save = ["dep:serde_json", "dep:zstd"]

[dependencies]
zng-var = { path = "../zng-var", version = "0.15.3", default-features = false }
zng-task = { path = "../zng-task", version = "0.15.4", default-features = false }
zng-txt = { path = "../zng-txt", version = "0.6.0", default-features = false }
zng-ext-config = { path = "../zng-ext-config", version = "0.15.4", default-features = false }
zng-unit = { path = "../zng-unit", version = "0.7.1", default-features = false }
zng-app = { path = "../zng-app", version = "0.25.4", default-features = false }
zng-clone-move = { path = "../zng-clone-move", version = "0.4.0", default-features = false }
zng-env = { path = "../zng-env", version = "0.12.2", default-features = false }

serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
tar = { version = "0.4.45", default-features = false, features = ["xattr"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
walkdir = { version = "2.5", default-features = false }
shell-escape = { version = "0.1.5", default-features = false }

serde_json = { version = "1.0", optional = true, default-features = false, features = ["std", "preserve_order"] }
zstd = { version = "0.14", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry = { version = "0.6.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Ole",
]
