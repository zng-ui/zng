[package]
name = "zng-wgt-wizard"
version = "0.1.2"
authors = ["The Zng Project Developers"]
edition = "2024"
license = "Apache-2.0 OR MIT"
readme = "README.md"
description = "Part of the zng project."
documentation = "https://zng-ui.github.io/doc/zng_wgt_container"
repository = "https://github.com/zng-ui/zng"
categories = ["gui"]
keywords = ["gui", "ui", "user-interface", "zng"]

[dependencies]
zng-wgt = { path = "../zng-wgt", version = "0.17.4", default-features = false }
zng-wgt-button = { path = "../zng-wgt-button", version = "0.16.4", default-features = false }
zng-wgt-stack = { path = "../zng-wgt-stack", version = "0.15.4", default-features = false }
zng-wgt-container = { path = "../zng-wgt-container", version = "0.16.4", default-features = false }
zng-wgt-text = { path = "../zng-wgt-text", version = "0.16.4", default-features = false }
zng-wgt-text-input = { path = "../zng-wgt-text-input", version = "0.16.4", default-features = false }
zng-wgt-input = { path = "../zng-wgt-input", version = "0.14.4", default-features = false }
zng-ext-input = { path = "../zng-ext-input", version = "0.17.4", default-features = false }
zng-wgt-style = { path = "../zng-wgt-style", version = "0.15.4", default-features = false }
zng-view-api = { path = "../zng-view-api", version = "0.22.4", default-features = false }
zng-app = { path = "../zng-app", version = "0.25.4", default-features = false }
zng-var = { path = "../zng-var", version = "0.15.3", default-features = false }
zng-wgt-markdown = { path = "../zng-wgt-markdown", version = "0.15.4", default-features = false }
zng-ext-font = { path = "../zng-ext-font", version = "0.16.4", default-features = false }
zng-wgt-scroll = { path = "../zng-wgt-scroll", version = "0.16.4", default-features = false }
zng-wgt-size-offset = { path = "../zng-wgt-size-offset", version = "0.14.4", default-features = false }
zng-wgt-fill = { path = "../zng-wgt-fill", version = "0.14.4", default-features = false }
